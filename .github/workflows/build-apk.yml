name: Build DSH Android APK

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - '**.md'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 本仓库
        uses: actions/checkout@v4

      - name: 克隆 termux-app（自定义壳）
        run: git clone --depth 1 https://github.com/termux/termux-app termux-app

      - name: 注入方案 B 首启装机资源
        run: |
          mkdir -p termux-app/app/src/main/assets/first-boot-extra
          cp apk/first-boot.sh termux-app/app/src/main/assets/
          cp dsh-termux/mobile/mobile.css termux-app/app/src/main/assets/first-boot-extra/
          cp dsh-termux/env/dsh.env.example termux-app/app/src/main/assets/first-boot-extra/
          echo "assets:"; find termux-app/app/src/main/assets -type f | sort

      - name: 应用首启装机补丁（让 termux-app 首启执行 first-boot.sh）
        run: |
          cd termux-app
          git apply --check ../apk/termux-app-firstboot.patch
          git apply ../apk/termux-app-firstboot.patch
          cd ..

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 设置 Android SDK
        uses: android-actions/setup-android@v3

      # termux-app 需要 NDK（编译 termux-bootstrap 原生库）。AGP 通常会自动下载，
      # 若构建报缺 NDK，取消注释并改成与 termux-app/build.gradle 匹配的版本：
      # - name: 安装 NDK
      #   run: sdkmanager "ndk;26.3.11579264"

      - name: 授予可执行权限
        run: chmod +x termux-app/gradlew

      - name: 编译 Debug APK
        run: |
          cd termux-app
          ./gradlew --no-daemon :app:assembleDebug

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: deepseek-harness-android-debug
          path: termux-app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
