name: Build DSH APK (改包名共存版)

# 手动触发：改包名 + 自定义 bootstrap（一次性重建）+ 首启装机补丁 → 出 APK
on:
  workflow_dispatch:
    inputs:
      package_name:
        description: '新包名（用于与官方 Termux 共存）'
        required: true
        default: 'com.dsh.termux'
      arch:
        description: '目标架构（手机 arm64-v8a → aarch64）'
        required: true
        default: 'aarch64'

permissions:
  contents: read

jobs:
  build-bootstrap:
    runs-on: ubuntu-latest
    # 重建 bootstrap 很重（数小时）。若超时/OOM，改用更大 runner 或 self-hosted。
    timeout-minutes: 360
    outputs:
      sha256: ${{ steps.hash.outputs.sha256 }}
    steps:
      - name: Checkout 本仓库
        uses: actions/checkout@v4

      - name: 构建自定义前缀 bootstrap
        run: |
          bash bootstrap/build-custom-bootstrap.sh "${{ inputs.package_name }}" "${{ inputs.arch }}"

      - name: 记录 SHA256
        id: hash
        run: |
          cd termux-packages
          echo "sha256=$(sha256sum bootstrap-${{ inputs.arch }}.zip | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: 上传 bootstrap
        uses: actions/upload-artifact@v4
        with:
          name: custom-bootstrap
          path: termux-packages/bootstrap-${{ inputs.arch }}.zip

  build-apk:
    needs: build-bootstrap
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout 本仓库
        uses: actions/checkout@v4

      - name: 下载自定义 bootstrap
        uses: actions/download-artifact@v4
        with:
          name: custom-bootstrap

      - name: 克隆 termux-app
        run: git clone --depth 1 https://github.com/termux/termux-app termux-app

      - name: 应用首启装机补丁 + 改包名补丁
        run: |
          cd termux-app
          git apply --check ../apk/termux-app-firstboot.patch
          git apply ../apk/termux-app-firstboot.patch
          git apply --check ../apk/termux-app-rename.patch
          git apply ../apk/termux-app-rename.patch
          cd ..

      - name: 注入首启装机资源
        run: |
          mkdir -p termux-app/app/src/main/assets/first-boot-extra
          cp apk/first-boot.sh termux-app/app/src/main/assets/
          cp dsh-termux/mobile/mobile.css termux-app/app/src/main/assets/first-boot-extra/
          cp dsh-termux/env/dsh.env.example termux-app/app/src/main/assets/first-boot-extra/

      - name: 用自定义 bootstrap 替换 aarch64 下载
        run: |
          # 只替换 arm64 用的 aarch64 bootstrap；其余架构仍下载官方（不会装到手机）
          cp bootstrap-${{ inputs.arch }}.zip termux-app/app/src/main/cpp/bootstrap-${{ inputs.arch }}.zip
          SHA="${{ needs.build-bootstrap.outputs.sha256 }}"
          sed -i -E "s|downloadBootstrap\(\"${{ inputs.arch }}\", \"[0-9a-f]+\", version\)|downloadBootstrap(\"${{ inputs.arch }}\", \"$SHA\", version)|" \
            termux-app/app/build.gradle
          grep -nE "downloadBootstrap\(\"${{ inputs.arch }}\"" termux-app/app/build.gradle

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 设置 Android SDK
        uses: android-actions/setup-android@v3

      - name: 编译 Debug APK
        run: |
          cd termux-app
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: dsh-termux-coexist-debug
          path: termux-app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
